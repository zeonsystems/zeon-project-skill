# Skill Metadata: Move Object
# Manipulation skill for moving an object to a destination position

skill_id: move_object
version: "1.0.0"
description: "Move an object to a specified destination position using robotic arm"

# Parameter structure is derived from `def move_object(...)` in robotic_code.py;
# descriptions come from the docstring Args: block. Add a top-level
# `parameter_descriptions: {name: text}` map here only to override docstring text.

preconditions:
  object_grasped: true
  gripper_closed: true
  destination_accessible: true

postconditions:
  object_at_destination: true
  arm_at_destination: true

safety_rules:
  - "Workspace boundaries must be enforced"
  - "Collision detection must be enabled"
  - "Emergency stop button must be accessible"
  - "Maximum arm speed: 500 mm/s"

tags:
  - manipulation
  - movement
  - pick-and-place
  - basic

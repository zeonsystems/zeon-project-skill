# Skill Metadata: Grab Object (Pick & Place variant)
# Pick and place manipulation skill for grasping objects with annotation-based positioning

skill_id: grab_object
version: "1.0.0"
description: "Grasp an object using annotation-based positioning with the left arm gripper"

# Parameter structure is derived from `def grab_object(...)` in robotic_code.py;
# descriptions come from the docstring Args: block. Add a top-level
# `parameter_descriptions: {name: text}` map here only to override docstring text.

preconditions:
  gripper_open: true
  object_visible: true
  left_arm_available: true
  workspace_clear: true
  annotations_loaded: true

postconditions:
  object_grasped: true
  gripper_closed: true
  object_attached_to_arm: true

tags:
  - manipulation
  - gripper
  - pick-and-place
  - grasp
